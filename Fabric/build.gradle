plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
    id 'maven-publish'
    id 'idea'
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.shedaniel.me/" }
    mavenCentral()
    maven { url "https://github.com/Serilum/.maven/raw/maven/" }
    // Added LuckPerms official repository for API resolution
    maven { url 'https://repo.lucko.me/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.1+ ships unobfuscated (real names baked into the jar) - no mappings artifact to declare
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "org.jetbrains:annotations:23.0.0"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    annotationProcessor 'com.google.code.gson:gson:2.10.1'
    compileOnly 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    compileOnly 'com.google.guava:guava:32.1.2-jre'

    // FastUtil for high-performance collections - Use implementation only, let mod loader handle versions
    implementation 'it.unimi.dsi:fastutil:8.5.15'

    // Caffeine for high-performance caching
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    include 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // SQLite database driver
    implementation 'org.xerial:sqlite-jdbc:3.43.2.0'
    include 'org.xerial:sqlite-jdbc:3.43.2.0'

    api("com.terraformersmc:modmenu:20.0.1") { exclude(module: "fabric-api") }

    implementation "me.lucko:fabric-permissions-api:0.7.0"
    include "me.lucko:fabric-permissions-api:0.7.0"
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}_fabric.refmap.json")
        useLegacyMixinAp = false
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

version = rootProject.version

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_name}" }
    }
    // Add Implementation-Version to manifest for dynamic version command
    manifest {
        attributes(
            'Implementation-Version': project.version
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.name
            version project.version
            from components.java
        }
    }

    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

base.archivesName = "minetracer-fabric-${minecraft_version}"

